<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Y3GYM 공통 소식 시각 프로토타입. 모든 제목·본문·날짜는 임시 예시입니다.">
    <title>{{title}} · Y3GYM</title>
    <link rel="preload" href="{{root}}assets/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{root}}styles.css">
    <script src="{{root}}app.js" defer></script>
    <script src="{{root}}post-context.js" type="module"></script>
  </head>
  <body class="content-page" data-page="{{page}}" data-site-root="{{root}}">
    <a class="skip-link" href="#main">본문으로 바로가기</a>
    <header class="site-header"><div class="container header-inner">
      <a class="wordmark" href="{{root}}index.html" data-branch-page aria-label="Y3GYM 홈">Y3GYM<span class="wordmark-dot" aria-hidden="true">.</span></a>
      <button class="menu-toggle" type="button" aria-controls="primary-navigation" aria-expanded="false" hidden>
        <svg class="menu-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span class="menu-toggle-label">메뉴</span>
      </button>
      <nav class="primary-navigation" id="primary-navigation" aria-label="주 메뉴">
        <a class="nav-link" href="{{root}}branches.html" data-branch-page>지점 안내</a>
        <a class="nav-link" href="{{root}}news.html" data-branch-page aria-current="page">소식</a>
        <a class="button button--small button--primary header-contact" href="{{root}}branches.html#contact" data-branch-page>문의하기</a>
      </nav>
    </div></header>

    <main id="main">{{content}}</main>

    <footer class="site-footer"><div class="container">
      <div class="footer-top">
        <a class="wordmark" href="{{root}}index.html" data-branch-page aria-label="Y3GYM 홈">Y3GYM<span class="wordmark-dot" aria-hidden="true">.</span></a>
        <nav class="footer-navigation" aria-label="하단 메뉴"><a href="{{root}}branches.html" data-branch-page>지점 안내</a><a href="{{root}}news.html" data-branch-page aria-current="page">소식</a></nav>
      </div>
      <p class="footer-description">시설과 이용 정보를 한눈에.</p>
      <p class="footer-note">시각 프로토타입 · 사진과 운영 정보는 임시 자료입니다.</p>
    </div></footer>

    <aside class="mobile-contact-bar" aria-label="문의할 지점 안내"><div class="mobile-contact-inner"><a class="button button--primary" href="{{root}}branches.html#contact" data-branch-page>전화 문의</a><a class="button button--secondary" href="{{root}}branches.html#contact" data-branch-page>카카오톡 문의</a></div></aside>
  </body>
</html>
