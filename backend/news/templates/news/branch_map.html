<div class="branch-map" data-branch-map data-map-address="{{ item.address }}" data-map-name="{{ item }}">
  <div class="branch-map-frame">
    <div class="branch-map-canvas" data-map-canvas role="region" aria-label="{{ item }} 주소 검색 결과 지도" hidden></div>
    <div class="map-placeholder" data-map-fallback><span class="map-label">{{ item }} 위치</span><span class="map-note">{% if item.map_search_url %}카카오맵에서 주소를 확인할 수 있습니다.{% else %}주소를 준비 중입니다.{% endif %}</span></div>
  </div>
  <p class="map-note branch-map-status" data-map-status role="status" aria-live="polite">{% if item.map_search_url %}페이지 안 지도를 사용할 수 없으면 외부 지도에서 주소를 확인하세요.{% else %}주소를 입력한 뒤 지도를 확인하세요.{% endif %}</p>
  {% if item.map_search_url %}<a class="text-link" href="{{ item.map_search_url }}" target="_blank" rel="noopener noreferrer" data-map-link aria-label="{{ item }} 카카오맵에서 열기">카카오맵에서 열기 <span aria-hidden="true">↗</span></a>{% endif %}
</div>
