{% load seo_tags %}{% site_favicon %}
<title>{{ seo.title }}</title>
<meta name="description" content="{{ seo.description }}">
{% if seo.canonical %}<link rel="canonical" href="{{ seo.canonical }}">{% endif %}
{% if seo.noindex %}<meta name="robots" content="noindex,nofollow">{% endif %}
<meta property="og:type" content="{{ seo.type }}">
<meta property="og:title" content="{{ seo.title }}">
<meta property="og:description" content="{{ seo.description }}">
<meta property="og:site_name" content="{{ seo.site_name }}">
<meta property="og:locale" content="ko_KR">
{% if seo.canonical %}<meta property="og:url" content="{{ seo.canonical }}">{% endif %}
{% for name, value in seo.verification.items %}{% if value %}<meta name="{{ name }}" content="{{ value }}">{% endif %}{% endfor %}
