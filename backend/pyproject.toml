[project]
name = "y3gym-cms"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django==5.2.18",
  "wagtail==7.4.3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
  "bleach>=6.2,<7",
  "gunicorn==26.2.0",
]

[dependency-groups]
dev = ["ruff>=0.15,<0.16"]

[tool.ruff]
target-version = "py313"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
